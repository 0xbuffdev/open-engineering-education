name: OEE current curriculum validation

on:
  pull_request:
    paths:
      - 'curriculum/**'
      - 'spec/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tooling/oee_toolkit/**'
      - '.github/workflows/outcome-curriculum.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'spec/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tooling/oee_toolkit/**'
      - '.github/workflows/outcome-curriculum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Require every published course to pass the current source contract
        run: python3 scripts/check-outcome-curriculum.py --all
      - name: Require the pinned Toolkit to accept every published course
        run: |
          REVISION="$(git rev-parse HEAD)"
          python3 -m tooling.oee_toolkit check \
            --repo . --revision "$REVISION" --all
