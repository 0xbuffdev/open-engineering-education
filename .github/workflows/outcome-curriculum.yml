name: OEE v0.2.0 outcome curriculum validation

on:
  pull_request:
    paths:
      - 'curriculum/**'
      - 'scripts/check-outcome-curriculum.py'
      - 'scripts/course_format_versions.py'
      - 'scripts/check-app-curriculum.py'
      - 'scripts/app_catalog.py'
      - 'tests/test_app_catalog.py'
      - 'scripts/check-sef-curriculum.py'
      - 'tests/test_outcome_curriculum.py'
      - 'tests/test_dual_format_validation.py'
      - '.github/workflows/outcome-curriculum.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'scripts/check-outcome-curriculum.py'
      - 'scripts/course_format_versions.py'
      - 'scripts/check-app-curriculum.py'
      - 'scripts/app_catalog.py'
      - 'tests/test_app_catalog.py'
      - 'scripts/check-sef-curriculum.py'
      - 'tests/test_outcome_curriculum.py'
      - 'tests/test_dual_format_validation.py'
      - '.github/workflows/outcome-curriculum.yml'

jobs:
  outcome-curriculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test outcome and mixed-format validators
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate migrated v0.2.0 courses
        run: python3 scripts/check-outcome-curriculum.py --all
