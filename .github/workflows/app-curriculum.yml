name: APP curriculum integrity

on:
  pull_request:
    paths:
      - 'curriculum/APP/**'
      - 'curriculum/README.md'
      - 'scripts/check-app-curriculum.py'
      - 'scripts/app_catalog.py'
      - 'tests/test_app_catalog.py'
      - 'tests/test_app_program_consistency.py'
      - 'scripts/course_format_versions.py'
      - 'scripts/check-outcome-curriculum.py'
      - '.github/workflows/app-curriculum.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum/APP/**'
      - 'curriculum/README.md'
      - 'scripts/check-app-curriculum.py'
      - 'scripts/app_catalog.py'
      - 'tests/test_app_catalog.py'
      - 'tests/test_app_program_consistency.py'
      - 'scripts/course_format_versions.py'
      - 'scripts/check-outcome-curriculum.py'

jobs:
  validate-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate APP catalog and courses
        run: python3 scripts/check-app-curriculum.py
      - name: Verify APP program prerequisites and graduation contract
        run: python3 -m unittest discover -s tests -p 'test_app_program_consistency.py' -v
