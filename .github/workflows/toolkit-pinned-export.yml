name: OEE Toolkit source-pinned export checks

on:
  pull_request:
    paths:
      - 'curriculum/**'
      - 'tooling/**'
      - 'scripts/check-outcome-curriculum.py'
      - 'tests/test_toolkit_pinned_export.py'
      - '.github/workflows/toolkit-pinned-export.yml'
  push:
    branches: [main]
    paths:
      - 'curriculum/**'
      - 'tooling/**'
      - 'scripts/check-outcome-curriculum.py'
      - 'tests/test_toolkit_pinned_export.py'
      - '.github/workflows/toolkit-pinned-export.yml'

permissions:
  contents: read

jobs:
  validation:
    name: Strict source and export integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full regression suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify representative v0.2.0 exports at this commit
        run: |
          REVISION="$(git rev-parse HEAD)"
          for COURSE in SEF1 SEF10 APP1 APP17 SYS1 AI1 SEC1 SEC9; do
            python3 -m tooling.oee_toolkit check \
              --repo . --revision "$REVISION" --course "$COURSE"
            python3 -m tooling.oee_toolkit export \
              --repo . --revision "$REVISION" --course "$COURSE" \
              --output "$RUNNER_TEMP/$COURSE.json"
            python3 -m json.tool "$RUNNER_TEMP/$COURSE.json" > /dev/null
          done
      - name: Verify every published course passes the current source contract
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          revision = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          result = subprocess.run(
              ["python3", "-m", "tooling.oee_toolkit", "check",
               "--repo", ".", "--revision", revision, "--all", "--json"],
              capture_output=True, text=True, check=False,
          )
          payload = json.loads(result.stdout)
          assert payload["structuralOutcome"] == "passed", payload
          assert result.returncode == 0, result.stderr
          assert not payload["checksSkipped"], payload
          print(f"{len(payload['courses'])} current course sources checked successfully.")
          PY

  portability:
    name: Offline Git/CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Exercise synthetic local Git fixtures
        run: python -m unittest discover -s tests -p 'test_toolkit_pinned_export.py' -v
